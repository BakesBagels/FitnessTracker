name: Security Pipeline (SCA + DAST)

on: [push]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- SCA (ЛР 12) ---
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy_report.json'

      # --- DAST (ЛР 13) ---
      - name: Build and Run App
        run: |
          docker build -t fitness-app .
          docker run -d -p 5000:5000 --name tracker fitness-app
          sleep 15

      # Чтобы избежать ошибки "Expecting value", мы удаляем старый файл 
      # и позволяем Docker-у самому создать его с нужными правами
      - name: Prepare Workspace
        run: |
          rm -f report_json.json
          mkdir -p zap_out
          chmod 777 zap_out

      - name: Run OWASP ZAP
        run: |
          # Добавляем -u root, чтобы не было Permission denied
          docker run --rm -u root -v $(pwd):/zap/wrk/:rw --network=host \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:5000 \
          -J report_json.json
        continue-on-error: true # Чтобы пайплайн не падал до работы Security Gate

      - name: Check Security Gate
        run: |
          # Если файл пустой или отсутствует, создадим минимально корректный JSON, 
          # чтобы скрипт не падал с Traceback
          if [ ! -s report_json.json ]; then
            echo '{"site": []}' > report_json.json
          fi
          python security_gate.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            trivy_report.json
            report_json.json
