name: SAST and SCA Scan

on: [push]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Стадия SAST (Анализ кода из ЛР11)
      - name: Run Semgrep
        run: |
          docker run --rm -v $(pwd):/src returntocorp/semgrep \
          semgrep --config .semgrep.yml --json --output semgrep-report.json . || true

      # 2. ОЧИСТКА (Гарантируем, что старые отчеты не подмешаются)
      - name: Clean old data
        run: |
          rm -f trivy_report.json
          docker system prune -f

# Стадия SCA (Trivy) через официальный экшен — это надежнее
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy_report.json'
          severity: 'CRITICAL,HIGH'

      # Проверка, что файл создался (для отладки)
      - name: Check if report exists
        run: ls -l trivy_report.json

      # 4. Настройка окружения для скрипта проверки
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 5. Сравнение результатов с политикой безопасности
      # Если в requirements.txt новые версии, этот шаг выдаст PASSED
      - name: Check Security Gate
        run: python security_gate.py

      # 6. Сохранение артефактов (отчетов) для отчета по лабе
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: security-reports
          path: |
            semgrep-report.json
            trivy_report.json
